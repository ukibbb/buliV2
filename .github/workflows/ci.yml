name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# minimalne uprawnienia
# token utworzony przez github actions moze tylko odczytac
# repozytorium
# Workflow wydania dostanie pozniej osobne szersze uprawnienia
#
permissions:
  contents: read

# otwiera ustawienia wspolbieznosci, czyli zasad dotyczacych
# kilku uruchomien tego samego workflow
concurrency:
  # buduje identyfikator grupy z nazwy workflow i brancha lub referencji
  # pull requesta
  # uruchomienia roznych branch nie beda sobie przeszkadzac
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # jezeli wypcheniesz kolejny commit github analuje starsze
  # dzialajace ci dla tej same referencji
  cancel-in-progress: true


# mapa zadan wykonywana przez workflow
#
#
jobs:
  # definiuje zadanie o technicznym idenyfikatorze verify
  verify:
    name: Typecheck, test and build
    # tworzy masznye wirtualna
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        # pobiera zawartosc wlasciwego commita
        # do maszyny CI
        uses: actions/checkout@v4
      - name: Install Bun
        # uruchamia akcje utrzymywana przez projekt Bun.
        # instaluje bun i dodaje jego plik wykonywalny do PATH
        uses: oven-sh/setup-bun@v2
        # otwiera argument przekazywane do setup bun
        with:
          bun-version: 1.3.12

      - name: Download ripgrep sidecar
        env:
          RIPGREP_VERSION: 14.1.1
          RIPGREP_SHA256: 4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
        run: |
          archive="$RUNNER_TEMP/ripgrep.tar.gz"
          directory="$RUNNER_TEMP/buli-ripgrep"
          curl --fail --location --silent --show-error \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$RIPGREP_SHA256" "$archive" | sha256sum --check
          mkdir -p "$directory"
          tar --extract --gzip --file "$archive" --directory "$directory" --strip-components=1
          "$directory/rg" --version
          echo "$directory" >> "$GITHUB_PATH"

      - name: Download fd sidecar
        env:
          FD_VERSION: 10.3.0
          FD_SHA256: 2b6bfaae8c48f12050813c2ffe1884c61ea26e750d803df9c9114550a314cd14
        run: |
          archive="$RUNNER_TEMP/fd.tar.gz"
          directory="$RUNNER_TEMP/buli-fd"
          curl --fail --location --silent --show-error \
            "https://github.com/sharkdp/fd/releases/download/v${FD_VERSION}/fd-v${FD_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$FD_SHA256" "$archive" | sha256sum --check
          mkdir -p "$directory"
          tar --extract --gzip --file "$archive" --directory "$directory" --strip-components=1
          "$directory/fd" --version
          echo "$directory" >> "$GITHUB_PATH"

      - name: Install dependencies
        # run przekazuje polecenie do shella maszyny CI
        # bun install - instaluje zaleznosci z package.json i bun.lock
        # --frozen-lockfile zabranie modyfikowania lockfile
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Build standalone binary
        run: bun run build:local
      - name: Smoke-test standalone binary
        run: ./dist/buli --help
