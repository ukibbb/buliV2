name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build release bundle
        env:
          BULI_RELEASE_TARGET: ${{ matrix.target }}
          BULI_RELEASE_TAG: ${{ github.ref_name }}
        run: bun run bundle:local

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/buli-${{ matrix.target }}.tar.gz
            dist/buli-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            "${release_flags[@]}" \
            release-files/*

  publish-npm:
    name: Publish npm package
    needs: publish
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Validate package version and select npm dist-tag
        id: package
        working-directory: npm
        shell: bash
        run: |
          version="$(node --print "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Release tag %s does not match npm package version %s\n' \
              "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            dist_tag="next"
          else
            dist_tag="latest"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'dist-tag=%s\n' "$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Verify npm package contents
        working-directory: npm
        run: npm pack --dry-run

      - name: Publish npm package
        working-directory: npm
        run: npm publish --access public --provenance --tag "${{ steps.package.outputs.dist-tag }}"
