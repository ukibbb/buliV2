name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Download ripgrep sidecar
        env:
          RIPGREP_VERSION: 14.1.1
          RIPGREP_SHA256: 4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
        run: |
          archive="$RUNNER_TEMP/ripgrep.tar.gz"
          directory="$RUNNER_TEMP/buli-ripgrep"
          curl --fail --location --silent --show-error \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$RIPGREP_SHA256" "$archive" | sha256sum --check
          mkdir -p "$directory"
          tar --extract --gzip --file "$archive" --directory "$directory" --strip-components=1
          "$directory/rg" --version
          echo "$directory" >> "$GITHUB_PATH"

      - name: Download fd sidecar
        env:
          FD_VERSION: 10.3.0
          FD_SHA256: 2b6bfaae8c48f12050813c2ffe1884c61ea26e750d803df9c9114550a314cd14
        run: |
          archive="$RUNNER_TEMP/fd.tar.gz"
          directory="$RUNNER_TEMP/buli-fd"
          curl --fail --location --silent --show-error \
            "https://github.com/sharkdp/fd/releases/download/v${FD_VERSION}/fd-v${FD_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$FD_SHA256" "$archive" | sha256sum --check
          mkdir -p "$directory"
          tar --extract --gzip --file "$archive" --directory "$directory" --strip-components=1
          "$directory/fd" --version
          echo "$directory" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Verify npm package contents
        run: npm pack ./npm --dry-run

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release bundle
        env:
          BULI_RELEASE_TARGET: ${{ matrix.target }}
          BULI_RELEASE_TAG: ${{ github.ref_name }}
        run: bun run bundle:local

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/buli-${{ matrix.target }}.tar.gz
            dist/buli-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            "${release_flags[@]}" \
            release-files/*

  publish-npm:
    name: Publish npm package
    needs: publish
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Validate package version and select npm dist-tag
        id: package
        working-directory: npm
        shell: bash
        run: |
          version="$(node --print "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Release tag %s does not match npm package version %s\n' \
              "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            dist_tag="next"
          else
            dist_tag="latest"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'dist-tag=%s\n' "$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Verify npm package contents
        working-directory: npm
        run: npm pack --dry-run

      - name: Publish npm package
        working-directory: npm
        run: npm publish --access public --provenance --tag "${{ steps.package.outputs.dist-tag }}"
